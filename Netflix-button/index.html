<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix-button</title>
    <link rel="stylesheet" href="css.css" />
    <script type="module" src="js.js"></script>
  </head>
  <body>
    <div class="wrap">
      <button id="menu">Tilbage til Menu</button>

      <button id="netflix" class="netflix-btn">
        <span class="label">Næste Episode</span>
        <span class="progress" aria-hidden="true"></span>
      </button>

      <div id="overlay" class="overlay" aria-hidden="true">Næste episode afspilles…</div>
    </div>
  </body>
</html>
